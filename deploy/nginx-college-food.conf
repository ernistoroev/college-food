# nginx: takes the requests from the internet and passes them to Django (gunicorn on 127.0.0.1:8000).
# Copy to /etc/nginx/sites-available/college-food (see DEPLOY_ORACLE.md).
# Django itself serves the API, the admin, Swagger, the React site and static files (whitenoise);
# nginx only serves the uploaded photos from media/.

server {
    listen 80;
    # "_" answers on any address, e.g. the server IP. With a domain, put the domain here.
    server_name _;

    # Dish photos are up to 5 MB, plus the rest of the form.
    client_max_body_size 6M;

    location /media/ {
        alias /home/ubuntu/college-food/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells Django whether the visitor came over http or https (DJANGO_BEHIND_PROXY in .env).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
